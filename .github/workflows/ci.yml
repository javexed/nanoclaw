name: CI

on:
  pull_request:
    # Gate merges into the long-lived integration branches, not just main —
    # channels-webchat is where all webchat work lands and was previously ungated.
    branches: [main, channels-webchat]
  # Also run on the branch head after merge: PR CI checks the PR head, but a merge
  # from a stale base can produce a different result — this catches a fix silently
  # dropped by the merge (e.g. the Codex container-typecheck guard regression).
  push:
    branches: [main, channels-webchat]

# One run per ref; a newer push/PR update cancels the older run (high PR volume).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No actions/setup-node — it throws "TypeError: Invalid URL" on Forgejo
      # Actions (its node-version manifest URL is malformed in the Forgejo runner
      # env, with or without cache:pnpm). The runner image
      # (catthehacker/ubuntu:act-22.04) already ships a current Node the
      # toolchain runs on fine.
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: pnpm install --frozen-lockfile
      - name: Install agent-runner deps (Bun)
        working-directory: container/agent-runner
        run: bun install --frozen-lockfile

      # NOTE: no `format:check` — the upstream base (nanocoai/nanoclaw) does not
      # hold this Prettier standard (its own src/ files fail it), so enforcing it
      # here would block every merge on inherited code and force permanent drift
      # from upstream. The gate enforces correctness (types + tests); style is
      # left to `pnpm run format` locally.
      - name: Typecheck host
        run: pnpm exec tsc --noEmit

      - name: Typecheck container
        run: pnpm exec tsc -p container/agent-runner/tsconfig.json --noEmit

      - name: Host tests
        run: pnpm exec vitest run

      - name: Container tests
        working-directory: container/agent-runner
        run: bun test
