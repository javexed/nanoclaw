<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111417">
<title>NanoClaw</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="login-screen" hidden>
  <form id="login-form">
    <h1>NanoClaw</h1>
    <p>Enter the access token for this install.</p>
    <input id="login-token" type="password" autocomplete="current-password" placeholder="Access token">
    <p id="login-error" class="login-error" hidden></p>
    <button type="submit">Connect</button>
  </form>
</div>

<div id="app">
  <aside id="sidebar">
    <header id="sidebar-header">
      <span class="brand">NanoClaw</span>
      <span class="sidebar-actions">
        <button id="manage-btn" type="button" title="Manage agents and models">⚙</button>
        <button id="new-room-btn" type="button" title="New room">+</button>
      </span>
    </header>
    <ul id="room-list"></ul>
  </aside>

  <main id="chat">
    <header id="chat-header">
      <button id="back-btn" type="button" aria-label="Back to rooms">‹</button>
      <span id="room-title">Pick a room</span>
      <button id="room-del-btn" type="button" aria-label="Delete room" title="Delete room" hidden>🗑</button>
    </header>
    <div id="connection-banner"></div>
    <div id="transcript">
      <div id="transcript-empty" hidden></div>
      <div id="messages"></div>
      <div id="thinking"></div>
      <div id="typing-line" hidden></div>
    </div>
    <button id="jump-pill" type="button" hidden></button>
    <form id="composer" hidden>
      <button id="attach-btn" type="button" title="Attach a file">📎</button>
      <input id="attach-input" type="file" multiple hidden>
      <textarea id="composer-input" rows="1" placeholder="Message… (/ for commands)"></textarea>
      <button id="stop-btn" type="button" title="Stop the agent">■</button>
      <button id="send-btn" type="submit" title="Send">➤</button>
    </form>
  </main>
</div>

<div id="wizard" hidden>
  <div id="wizard-card">
    <header id="wizard-header">
      <span>Welcome to NanoClaw</span>
      <span id="wizard-step" class="wiz-stepno"></span>
    </header>
    <div id="wizard-body"></div>
    <footer id="wizard-footer">
      <button id="wizard-skip" type="button">Skip setup</button>
    </footer>
  </div>
</div>

<aside id="manage">
  <header id="manage-header">
    <span>Manage</span>
    <button id="manage-close" type="button" aria-label="Close">✕</button>
  </header>
  <nav id="manage-tabs">
    <button id="mtab-agents" type="button" class="active">Agents</button>
    <button id="mtab-models" type="button">Models</button>
  </nav>
  <div id="mpane-agents" class="mpane"></div>
  <div id="mpane-models" class="mpane" hidden></div>
</aside>

<dialog id="new-room-dialog">
  <form id="new-room-form" method="dialog">
    <h2>New room</h2>
    <label>Name <input id="new-room-name" type="text" maxlength="80" required></label>
    <label>Agent <select id="new-room-agent"></select></label>
    <menu>
      <button id="new-room-cancel" type="button">Cancel</button>
      <button type="submit" value="create">Create</button>
    </menu>
  </form>
</dialog>

<div id="slash-menu" hidden></div>
<div id="toasts"></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
